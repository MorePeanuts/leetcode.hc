# Checks the pack on every push to main and every pull request. Written by
# `hc pack init`.
name: Check

# Not on pushes to other branches or of tags: a pull request's branch is
# checked by its pull_request run, and a tag is pushed only on a commit of
# main that passed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds and runs the Go references; hc pack check vets them against the
      # oldest Go the protocol supports itself.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The oldest Python the protocol supports: the pack's references and
      # checkers must run on it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # The hc the pack is checked with: its released linux_amd64 binary,
      # checked against the SHA-256 that its release's checksums.txt lists.
      # Bump both on purpose: read what changed with
      # `hc docs protocol protocol-versions`, then run `hc skill install` and
      # commit the refreshed skills with the bump.
      - name: Install hc
        env:
          HC_VERSION: 0.1.0-alpha.10
          HC_SHA256: 16a92a98de096123c337223e39cbd32b52d74f12025be191838d06c5d8376f2c
        run: |
          archive="handcoding_${HC_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/MorePeanuts/handcoding/releases/download/v${HC_VERSION}/$archive"
          echo "$HC_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hc"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hc" hc
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
      # hc.yaml is not committed (.gitignore): it holds the settings of a
      # checkout, here the Python set up above instead of a virtual
      # environment of hc's.
      - name: Configure hc
        run: |
          printf 'python:\n  interpreter: python3\n' > hc.yaml
      - name: Check the pack
        run: hc pack check
      # --force: the committed copies of hc's skills must be exactly the
      # pinned hc's, edits included. Keep your own notes in CLAUDE.md or in a
      # skill of your own, which hc never touches.
      - name: Check that the committed skills are the pinned hc's
        run: |
          hc skill install --force
          git add --intent-to-add -- AGENTS.md .claude .agents
          git diff --exit-code -- AGENTS.md .claude .agents || {
            echo "::error::The committed skills differ from those of the pinned hc: run \`hc skill install\` and commit the result."
            exit 1
          }
